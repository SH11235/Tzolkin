[workspace]
members = [
  "crates/tzolkin-core",
  "crates/tzolkin-bot",
  "crates/tzolkin-ai",
  "crates/tzolkin-wasm",
  "src-tauri",
]
default-members = ["crates/tzolkin-core", "crates/tzolkin-bot", "crates/tzolkin-ai"]
resolver = "3"

[profile.release]
lto = true
codegen-units = 1

# Tests need optimized code to finish in reasonable time. Level 1 halves the
# build of the workspace crates compared with level 2 and costs about a tenth
# in run time; dependencies are built once and cached, so they use level 3.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3
