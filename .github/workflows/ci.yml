name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  # Runs on master keep the dependency caches that pull requests restore.
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        run: |
          # A pull request checks out its merge commit; the first parent is the base.
          rust=true
          if [[ $GITHUB_EVENT_NAME == pull_request ]] &&
            ! git diff --name-only HEAD^1 HEAD |
              grep -qE '^(crates/|src-tauri/|scripts/|tests/fixtures/|\.github/|Cargo\.(toml|lock)$|package(-lock)?\.json$)'; then
            rust=false
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p tzolkin-core -p tzolkin-ai -p tzolkin-wasm --all-targets -- -D warnings
      - run: npm run lint

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: npm ci
      - run: npm run test:core
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: 2
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
      - run: cargo build --locked -p tzolkin-ai
      - run: npm run test:bga

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - id: bindgen
        run: |
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/tzolkin-wasm/Cargo.toml)
          [[ -n $version ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$HOME/.local/wasm-bindgen/bin" >> "$GITHUB_PATH"
      # scripts/build-wasm.mjs uses a wasm-bindgen of the pinned version from PATH.
      - id: bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-${{ steps.bindgen.outputs.version }}
      - if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "$VERSION" --locked --root "$HOME/.local/wasm-bindgen"
        env:
          VERSION: ${{ steps.bindgen.outputs.version }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/wasm-bindgen-build
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Linux dependencies
        run: bash scripts/ci-install-linux-dependencies.sh
      - run: npm ci
      - run: cargo clippy --locked -p tzolkin -- -D warnings
      # Pull requests stop at the type check above; master builds the release binary.
      - if: github.event_name == 'push'
        run: npm run tauri build -- --no-bundle
