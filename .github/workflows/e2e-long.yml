name: Long E2E

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-long-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-long:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - id: bindgen
        run: |
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/tzolkin-wasm/Cargo.toml)
          [[ -n $version ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$HOME/.local/wasm-bindgen/bin" >> "$GITHUB_PATH"
      - id: bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-${{ steps.bindgen.outputs.version }}
      - if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "$VERSION" --locked --root "$HOME/.local/wasm-bindgen"
        env:
          VERSION: ${{ steps.bindgen.outputs.version }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/wasm-bindgen-build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:long
